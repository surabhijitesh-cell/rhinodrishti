name: Daily Audit

on:
  schedule:
    - cron: '0 1 * * *'    # 06:30 IST = 01:00 UTC daily
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Run daily audit
        id: audit
        env:
          ADMIN_PASS: ${{ secrets.RHINO_ADMIN_PASSWORD }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          pip install requests -q

          python3 << 'PYEOF'
          import requests, json, os, sys
          from datetime import datetime, timezone

          BASE    = "https://rhino-drishti-api.onrender.com/api"
          PASS    = os.environ.get("ADMIN_PASS", "")
          OR_KEY  = os.environ.get("OPENROUTER_KEY", "")

          issues  = []
          report  = [f"## Rhino Drishti Daily Audit — {datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC')}"]
          report.append("")

          # ── Login ───────────────────────────────────────────────────────────
          try:
              r = requests.post(f"{BASE}/auth/login",
                  json={"username": "admin", "password": PASS}, timeout=30)
              r.raise_for_status()
              token = r.json().get("token", "")
              headers = {"Authorization": f"Bearer {token}"}
              report.append("✅ Login OK")
          except Exception as e:
              issues.append(f"🚨 Login FAILED: {e}")
              token = ""
              headers = {}

          # ── Intelligence queue depth ─────────────────────────────────────
          if token:
              try:
                  r = requests.get(f"{BASE}/intelligence?limit=1", headers=headers, timeout=30)
                  data = r.json()
                  total = data.get("total", "?")
                  report.append(f"📊 Intelligence items in DB: **{total}**")
                  if isinstance(total, int) and total == 0:
                      issues.append("⚠️ Intelligence DB is empty — pipeline may have stalled")
              except Exception as e:
                  issues.append(f"⚠️ Intelligence endpoint error: {e}")

          # ── Pipeline stats (unprocessed items) ──────────────────────────
          if token:
              try:
                  r = requests.get(f"{BASE}/analytics/pipeline-stats", headers=headers, timeout=30)
                  if r.status_code == 200:
                      d = r.json()
                      unprocessed = d.get("unprocessed", d.get("pending", "?"))
                      report.append(f"⚙️ Unprocessed items: **{unprocessed}**")
                      if isinstance(unprocessed, int) and unprocessed > 500:
                          issues.append(f"⚠️ Unprocessed queue high: {unprocessed} items — AI pipeline may be lagging")
              except:
                  pass  # endpoint may vary

          # ── API spend (admin) ────────────────────────────────────────────
          if token:
              try:
                  r = requests.get(f"{BASE}/admin/api-usage", headers=headers, timeout=30)
                  if r.status_code == 200:
                      d = r.json()
                      report.append(f"💰 API usage today: {json.dumps(d).replace('{','').replace('}','')[:200]}")
                      today_usd = d.get("today_usd", d.get("total_today_usd", 0))
                      limit = d.get("threshold_usd", d.get("daily_limit_usd", 5))
                      pct = (today_usd / limit * 100) if limit else 0
                      if pct > 80:
                          issues.append(f"🚨 API spend at {pct:.0f}% of daily limit (${today_usd:.2f} / ${limit})")
              except:
                  pass

          # ── Source freshness ─────────────────────────────────────────────
          if token:
              try:
                  r = requests.get(f"{BASE}/sources?limit=5", headers=headers, timeout=30)
                  if r.status_code == 200:
                      sources = r.json()
                      if isinstance(sources, list):
                          report.append(f"📡 Active sources: {len(sources)}")
              except:
                  pass

          # ── OpenRouter balance ───────────────────────────────────────────
          if OR_KEY:
              try:
                  r = requests.get("https://openrouter.ai/api/v1/auth/key",
                      headers={"Authorization": f"Bearer {OR_KEY}"}, timeout=15)
                  if r.status_code == 200:
                      d = r.json().get("data", {})
                      usage    = d.get("usage", 0)
                      limit    = d.get("limit")
                      remaining = round(limit - usage, 4) if limit else None
                      if remaining is not None:
                          report.append(f"🔑 OpenRouter: ${usage:.4f} used, **${remaining:.4f} remaining**")
                          if remaining < 2.0:
                              issues.append(f"🚨 OpenRouter balance critically low: **${remaining:.2f}** — top up at openrouter.ai/settings/credits")
                          elif remaining < 5.0:
                              issues.append(f"⚠️ OpenRouter balance low: ${remaining:.2f} — consider topping up soon")
                      else:
                          report.append(f"🔑 OpenRouter: ${usage:.4f} used (no limit set)")
              except Exception as e:
                  report.append(f"⚠️ OpenRouter check failed: {e}")
          else:
              report.append("⚠️ OpenRouter key not set — add OPENROUTER_API_KEY to GitHub Secrets for credit monitoring")

          # ── Brief generation status ──────────────────────────────────────
          if token:
              try:
                  r = requests.get(f"{BASE}/daily-brief", headers=headers, timeout=30)
                  if r.status_code == 200:
                      d = r.json()
                      status = d.get("status", "unknown")
                      date   = d.get("date", "?")
                      report.append(f"📋 Latest daily brief: **{status}** ({date})")
                      if status not in ("ready", "generating"):
                          issues.append(f"⚠️ Daily brief status: {status} — may need manual regeneration")
              except:
                  pass

          # ── Output ───────────────────────────────────────────────────────
          report.append("")
          if issues:
              report.append("### ⚠️ Issues Requiring Attention")
              report.extend(issues)
              report.append("")
              report.append("_Check [GitHub Actions logs](https://github.com/surabhijitesh-cell/rhinodrishti/actions) for details._")
          else:
              report.append("### ✅ All systems nominal — no issues detected")

          full_report = "\n".join(report)
          print(full_report)

          # Write for next step
          with open("audit_report.md", "w") as f:
              f.write(full_report)

          # Set output for conditional issue creation
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"HAS_ISSUES={'true' if issues else 'false'}\n")
              f.write(f"ISSUE_COUNT={len(issues)}\n")

          PYEOF

      - name: Create GitHub Issue if problems found
        if: steps.audit.outputs.HAS_ISSUES == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('audit_report.md', 'utf8');
            const count = '${{ steps.audit.outputs.ISSUE_COUNT }}';

            // Check for existing open audit issue today
            const today = new Date().toISOString().split('T')[0];
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'audit',
              state: 'open'
            });
            const todayIssue = existing.data.find(i => i.title.includes(today));
            if (todayIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: todayIssue.number,
                body: `**Re-audit at ${new Date().toUTCString()}:**\n\n${body}`
              });
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ Daily Audit: ${count} issue(s) found — ${today}`,
              body,
              labels: ['audit', 'automated']
            });
